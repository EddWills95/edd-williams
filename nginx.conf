server {
	listen 80;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_vary on;
	gzip_min_length 512;
	gzip_types text/css application/javascript image/svg+xml application/json;

	# Vite/SvelteKit hashes these filenames, so they can be cached indefinitely.
	location ^~ /_app/immutable/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	# Unhashed static assets: cache for a day, then revalidate.
	location ~* \.(webp|png|ico|svg|jpg|woff2)$ {
		add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
	}

	# HTML is always revalidated so a new deploy is picked up straight away.
	location / {
		add_header Cache-Control "no-cache";
		try_files $uri $uri.html $uri/ =404;
	}
}
